[project]
name = "walletscanner"
version = "0.1.0"
description = "The app to retrieve Polymarket wallet balances and transactions."
authors = [
    {name = "Polina Semenova",email = "polina-semenova-10@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "web3 (>=8.0.0,<9.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]

[tool.poetry]
packages = [{include = "walletscanner"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
